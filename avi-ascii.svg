  <style>
    text {
      font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace;
      font-size: 6.6px;
      letter-spacing: 0;
      white-space: pre;
      dominant-baseline: alphabetic;
    }
    .w {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation: wipe 5.64s linear infinite;
    }
    @keyframes wipe {
      0%   { transform: scaleX(0); }
      7.447% { transform: scaleX(1); }
      82.270% { transform: scaleX(1); }
      100% { transform: scaleX(1); }
    }
    .cursor { animation: blink 1.06s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .frame { fill: none; stroke: #21262d; stroke-width: 1; }
    </style>
