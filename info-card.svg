      10.476%  { opacity: 1; transform: translateX(0); }
      88.571% { opacity: 1; transform: translateX(0); }
      100%           { opacity: 0; transform: translateX(0); }
    }
    .cursor { animation: blink 1.06s steps(1) infinite; fill: #39d353; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>
