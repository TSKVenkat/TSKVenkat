  <style>
    text {
      font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace;
      font-size: 11.5px;
      white-space: pre;
    }
    .t { font-size: 13px; fill: #9be9a8; font-weight: 600; }
